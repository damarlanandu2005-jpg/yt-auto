<!doctype html><meta charset="utf-8"><body style="margin:0">
<canvas id="c" width="2160" height="1920"></canvas>
<script type="module">
// Look test: the owner's ChatGPT backgrounds (29 Oct) with our stickman and Twemoji on top (bg_tmp/, not in git).
import { hero } from '../character.js';
import { emoji } from '../props.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
const images = new Map();
for (const n of ['ring_buoy', 'skull', 'fire', 'fish', 'tropical_fish', 'octopus', 'anatomical_heart', 'pill']) { const im = await load(`../emoji/${n}.svg`).catch(() => null); if (im) images.set(`assets/emoji/${n}.svg`, im); }
const mk = () => ({ t: 1.3, W: 1080, H: 1920, time: (v) => v, rand: () => 0.5, engine: { image: (k) => images.get(k) },
  draw(o, fn) { ctx.save(); ctx.translate(o.x ?? 0, o.y ?? 0); fn(ctx, { p: 1, local: 1 }); ctx.restore(); } });
const shots = [
  ['volcano_crater', [{ x: 540, y: 1500, scale: 1.6, pose: 'scared', face: 'shocked' }], []],
  ['titanic_deck_night', [{ x: 420, y: 1560, scale: 1.7, pose: 'point', face: 'scared' }, { x: 760, y: 1380, scale: 1.1, pose: 'scared', face: 'shocked', flip: true }], [['ring_buoy', 860, 1050, 150]]],
  ['underwater', [{ x: 540, y: 1450, scale: 1.4, pose: 'float', face: 'wow' }], [['tropical_fish', 280, 700, 160], ['octopus', 820, 1150, 200]]],
  ['hospital_room', [{ x: 360, y: 1600, scale: 1.7, pose: 'think', face: 'thinking' }], []],
];
for (const [i, [bg, people, things]] of shots.entries()) {
  ctx.save(); ctx.translate(i * 540, 0); ctx.scale(0.5, 0.5);
  ctx.drawImage(await load(`bg_tmp/${bg}.png`), 0, 0, 1080, 1920);
  const s = mk();
  things.forEach(([n, x, y, size]) => images.has(`assets/emoji/${n}.svg`) && emoji(s, n, { x, y, size }));
  people.forEach((p) => hero(s, { ...p, outline: '#ffffff', moves: [{ at: 0, pose: p.pose, face: p.face }] }));
  ctx.restore();
}
document.title = 'done';
</script>
