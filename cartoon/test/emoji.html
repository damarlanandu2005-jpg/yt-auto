<!doctype html><meta charset="utf-8"><body style="margin:0">
<canvas id="c" width="2160" height="1920"></canvas>
<script type="module">
// Test page for props.emoji() (Twemoji, owner's choice 29 Oct): three 9:16 scenes with the stickman, then a grid
// of sample emoji with their white sticker edge on the dark look. A stand-in `s` preloads the images like explainroo.
import { hero } from '../character.js';
import { background, emoji, label } from '../props.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const grid = ['whale','shark','octopus','crocodile','elephant','lion_face','wolf_face','snake','spider','t_rex','sauropod','mammoth',
  'ship','passenger_ship','airplane','helicopter','rocket','satellite','volcano','cloud_with_tornado','fire','snowflake',
  'skull','bone','lungs','anatomical_heart','brain','tooth','bomb','microscope','hourglass','european_castle','moyai','penguin','eagle','mosquito'];
const used = new Set([...grid, 'ringed_planet', 'comet']);
const images = new Map();
await Promise.all([...used].map((n) => new Promise((ok) => { const im = new Image(); im.onload = ok; im.onerror = () => { console.log('missing', n); ok(); }; im.src = `../emoji/${n}.svg`; images.set(`assets/emoji/${n}.svg`, im); })));
const mk = (W = 1080) => ({ t: 1.3, W, H: 1920, time: (v) => v, rand: (j) => Math.abs(Math.sin(j * 12.9898 + 4.1) * 43758.5453) % 1,
  engine: { image: (k) => images.get(k) }, draw(o, fn) { ctx.save(); ctx.translate(o.x ?? 0, o.y ?? 0); fn(ctx, { p: 1, local: 1 }); ctx.restore(); } });
const scene = (col, kind, items, pose, face, text) => {
  ctx.save(); ctx.translate(col * 360, 0); ctx.scale(1 / 3, 1 / 3); ctx.beginPath(); ctx.rect(0, 0, 1080, 1920); ctx.clip();
  const s = mk(); background(s, kind);
  items.forEach(([n, x, y, size, flip]) => emoji(s, n, { x, y, size, flip }));
  hero(s, { x: 540, y: 1250, scale: 1.4, outline: '#ffffff', moves: [{ at: 0, pose, face }] });
  label(s, text, { y: 1480, size: 90 });
  ctx.restore(); };
scene(0, 'ocean', [['shark', 760, 820, 340, true], ['whale', 330, 420, 420], ['octopus', 800, 300, 220]], 'scared', 'shocked', 'SHARK');
scene(1, 'land', [['t_rex', 800, 700, 460, true], ['volcano', 260, 520, 300]], 'scared', 'scared', 'T REX');
scene(2, 'space', [['satellite', 300, 380, 300], ['ringed_planet', 800, 520, 300], ['comet', 280, 820, 220]], 'shrug', 'wow', 'SPACE');
ctx.fillStyle = '#0d1328'; ctx.fillRect(1080, 0, 1080, 1920);
const s2 = mk(2160);
grid.forEach((n, i) => { const x = 1170 + (i % 6) * 170, y = 120 + Math.floor(i / 6) * 300;
  emoji(s2, n, { x, y, size: 130 }); ctx.font = '22px Inter'; ctx.fillStyle = '#ccd'; ctx.textAlign = 'center'; ctx.fillText(n, x, y + 110); });
document.title = 'done';
</script>
