<!doctype html><meta charset="utf-8"><body style="margin:0">
<canvas id="c" width="2160" height="2560"></canvas>
<script type="module">
// Test page (owner 29 Oct, options A+B): three free emoji sets next to our stickman. Each row: two 9:16 scenes
// (ocean, space) with three objects, then all 16 sample objects on the dark look. Files are loaded as images only.
import { hero } from '../character.js';
import { background, label } from '../props.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const names = ['whale','shark','octopus','elephant','lion','snake','trex','ship','airplane','train','castle','skull','volcano','satellite','tornado','mushroom'];
const sets = [['fluent', 'Fluent Emoji (MIT)'], ['openmoji', 'OpenMoji (CC BY-SA 4.0)'], ['twemoji', 'Twemoji (CC BY 4.0)']];
const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
const mk = () => ({ t: 1.3, W: 1080, H: 1920, time: (v) => v, rand: (j) => Math.abs(Math.sin(j * 12.9898 + 4.1) * 43758.5453) % 1,
  draw(o, fn) { ctx.save(); ctx.translate(o.x ?? 0, o.y ?? 0); fn(ctx, { p: 1, local: 1 }); ctx.restore(); } });
for (const [r, [dir, title]] of sets.entries()) {
  const ims = {}; for (const n of names) ims[n] = await load(`emoji_tmp/${dir}/${n}.svg`);
  const y0 = r * 853;
  const scene = (col, kind, items) => {
    ctx.save(); ctx.translate(col * 380, y0); ctx.scale(0.44, 0.44); ctx.beginPath(); ctx.rect(0, 0, 1080, 1920); ctx.clip();
    const s = mk(); background(s, kind);
    items.forEach(([n, x, y, sz]) => ims[n] && ctx.drawImage(ims[n], x - sz / 2, y - sz / 2, sz, sz));
    hero(s, { x: 540, y: 1250, scale: 1.4, outline: '#ffffff', moves: [{ at: 0, pose: 'scared', face: 'shocked' }] });
    label(s, title.split(' (')[0].toUpperCase(), { y: 1500, size: 80 });
    ctx.restore(); };
  scene(0, 'ocean', [['whale', 300, 450, 380], ['shark', 800, 800, 300], ['ship', 700, 250, 260]]);
  scene(1, 'space', [['satellite', 300, 400, 300], ['trex', 800, 600, 320], ['volcano', 260, 900, 260]]);
  ctx.fillStyle = '#0d1328'; ctx.fillRect(780, y0, 1380, 845);
  ctx.font = '700 40px Inter'; ctx.fillStyle = '#fff'; ctx.fillText(title, 810, y0 + 60);
  names.forEach((n, i) => { const x = 880 + (i % 8) * 160, y = y0 + 210 + Math.floor(i / 8) * 330;
    if (ims[n]) ctx.drawImage(ims[n], x - 65, y - 65, 130, 130);
    ctx.font = '24px Inter'; ctx.fillStyle = ims[n] ? '#ccd' : '#f66'; ctx.textAlign = 'center'; ctx.fillText(ims[n] ? n : n + ' (none)', x, y + 100); ctx.textAlign = 'left'; });
}
document.title = 'done';
</script>
