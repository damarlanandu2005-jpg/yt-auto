<!doctype html><meta charset="utf-8"><body style="margin:0">
<canvas id="c" width="2160" height="1920"></canvas>
<script type="module">
// Test page: every background (small 9:16 tiles) and every prop, with a tiny stand-in for explainroo's `s`.
import { hero } from '../character.js';
import { background, thing, THING_NAMES, label } from '../props.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const kinds = ['space', 'ocean', 'deep', 'sky', 'land', 'city', 'night', 'body', 'desert', 'snow', 'fire', 'room'];
kinds.forEach((k, i) => {
  const s = { t: 1.3, W: 1080, H: 1920, time: (v) => v, rand: (j) => Math.abs(Math.sin(j * 12.9898 + 4.1) * 43758.5453) % 1,
    draw(o, fn) { ctx.save(); ctx.translate(o.x ?? 0, o.y ?? 0); fn(ctx, { p: 1, local: 1 }); ctx.restore(); } };
  ctx.save(); ctx.translate((i % 6) * 360, Math.floor(i / 6) * 640); ctx.scale(1 / 3, 1 / 3);
  ctx.beginPath(); ctx.rect(0, 0, 1080, 1920); ctx.clip();
  background(s, k);
  hero(s, { x: 540, y: 1250, scale: 1.4, outline: '#ffffff', moves: [{ at: 0, pose: 'shrug', face: 'wow' }] });
  label(s, k.toUpperCase(), { y: 300, size: 130 });
  ctx.restore();
});
const s2 = { t: 1.3, W: 2160, H: 1920, time: (v) => v, rand: () => 0.5, draw(o, fn) { ctx.save(); ctx.translate(o.x ?? 0, o.y ?? 0); fn(ctx, { p: 1, local: 1 }); ctx.restore(); } };
ctx.fillStyle = '#fbf3e4'; ctx.fillRect(0, 1280, 2160, 640);
THING_NAMES.forEach((n, i) => { const x = 120 + (i % 10) * 210, y = 1420 + Math.floor(i / 10) * 280;
  thing(s2, n, { x, y, size: 130 }); ctx.font = '28px Inter'; ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.fillText(n, x, y + 120); });
document.title = 'done';
</script>
