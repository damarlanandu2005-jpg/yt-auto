name: Cartoon render (called by other workflows)

# Renders an explainroo project from an artifact. Runs outside code (explainroo and its npm packages), so it
# has read-only permissions, no secrets and no saved git credentials (same rule as cartoon-test.yml).
on:
  workflow_call:
    inputs:
      project_artifact:
        description: "artifact holding project/ (script.md, scenes.js, video.json)"
        type: string
        required: true
      out_artifact:
        type: string
        required: true
    outputs:
      errors:
        description: "explainroo check errors"
        value: ${{ jobs.render.outputs.errors }}

permissions:
  contents: read

env:
  EXPLAINROO_COMMIT: e95232c   # v0.4.1, 20 Oct 2026, read before use

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      errors: ${{ steps.make.outputs.errors }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.project_artifact }}
          path: in

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1

      - name: Install FFmpeg 8.1 (stable)
        timeout-minutes: 5
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Get explainroo (pinned)
        timeout-minutes: 5
        run: |
          git clone -q https://github.com/vincentsch/explainroo "$HOME/explainroo"
          git -C "$HOME/explainroo" checkout -q "$EXPLAINROO_COMMIT"

      - name: Cache explainroo models (voice + word timing)
        uses: actions/cache@v4
        with:
          path: ~/.cache/explainroo
          key: explainroo-models-${{ env.EXPLAINROO_COMMIT }}

      - name: Install explainroo packages
        timeout-minutes: 10
        working-directory: /home/runner/explainroo
        run: npm ci --no-audit --no-fund

      - name: Make the video
        id: make
        timeout-minutes: 25
        working-directory: /home/runner/explainroo
        env:
          EXPLAINROO_CHROME: /usr/bin/google-chrome
        run: |
          set -o pipefail
          P=short
          mkdir -p videos out
          cp -r "$GITHUB_WORKSPACE/in/project" "videos/$P"
          cp "$GITHUB_WORKSPACE"/cartoon/*.js "$GITHUB_WORKSPACE"/cartoon/*.json "videos/$P/"   # character, props, look
          x() { echo "::group::$*"; node bin/explainroo.js "$@" 2>&1 | tee -a out/log.txt; echo "::endgroup::"; }
          x voice "videos/$P"
          x check "videos/$P" || true
          n=$(grep -c '^ERROR' out/log.txt || true)
          echo "errors=${n:-0}" >> "$GITHUB_OUTPUT"
          x still "videos/$P" || true
          x sheet "videos/$P" || true
          x render "videos/$P"
          x verify "videos/$P" || true
          mkdir -p out/render && cp videos/$P/out/video.mp4 videos/$P/out/video.cover.jpg videos/$P/out/video.srt videos/$P/out/sheet.jpg out/render/ 2>/dev/null || true
          cp -r videos/$P/out/stills out/render/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.out_artifact }}
          path: /home/runner/explainroo/out
          retention-days: 7
