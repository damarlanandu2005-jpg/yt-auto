name: Pixel effects tests

on:
  push:
    branches: [test/vector-cartoon-2d]
    paths:
      - "yt_auto/pixel_effects.py"
      - "tests/test_pixel_effects.py"
      - ".github/workflows/pixel-effects-test.yml"
  pull_request:
    paths:
      - "yt_auto/pixel_effects.py"
      - "tests/test_pixel_effects.py"
      - ".github/workflows/pixel-effects-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install "numpy>=1.26"
      - name: Test RGB effects
        run: python -m unittest discover -s tests -v
