name: Shorts from a long video

# Manual only. Makes 1-3 vertical "zoom journey" Shorts from a finished long video's checked script
# (bench-results/phase1/<long_run>/). Facts are reused exactly; new: one hook question, 6-8 AI ink
# drawings per Short (Cloudflare, about 80 neurons each), captions, louder mix. The owner reviews and
# uploads by hand. Results: bench-results/shorts/<run_id>/ and a "short-<run_id>" pre-release.
on:
  workflow_dispatch:
    inputs:
      long_run:
        description: "Run id of the long video (bench-results/phase1/<id>)"
        required: true
        default: "40692715659"
      count:
        description: "How many Shorts (1-3)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # FFmpeg 8.1 stable static build, cached (CLAUDE.md lesson 1)
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1

      - name: Install FFmpeg 8.1 (stable)
        timeout-minutes: 5
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Cache subtitle model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en

      - name: Install Python packages
        timeout-minutes: 10
        run: pip install -r requirements.txt && python phase5/make_shorts.py --help > /dev/null

      - name: Download voice model (first run only)
        timeout-minutes: 5
        run: bash scripts/download_models.sh models

      - name: Get the long video's checked script
        timeout-minutes: 2
        env:
          LONG: ${{ inputs.long_run }}
        run: |
          [[ "$LONG" =~ ^[0-9]+$ ]] || { echo "long_run must be a run id (digits)"; exit 1; }
          mkdir -p out/long
          git fetch --depth 1 origin bench-results
          for f in script.json sources.json delivery.json keywords.json; do
            git show "FETCH_HEAD:phase1/$LONG/$f" > "out/long/$f" 2>/dev/null && echo "got $f" || rm -f "out/long/$f"
          done
          [ -f out/long/script.json ] && [ -f out/long/sources.json ] || { echo "no script.json/sources.json for run $LONG"; exit 1; }

      - name: Make the Shorts
        timeout-minutes: 55
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COUNT: ${{ inputs.count }}
        run: |
          set -o pipefail
          [[ "$COUNT" =~ ^[1-3]$ ]] || { echo "count must be 1, 2 or 3"; exit 1; }
          mkdir -p out/shorts
          python phase5/make_shorts.py --long out/long --count "$COUNT" --models models --out out/shorts 2>&1 | tee out/shorts/build.log

      - name: Publish as a GitHub Release (pre-release, private repo)
        if: success()
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls out/shorts/short*/short*.mp4 out/shorts/short*/short*_description.txt 2>/dev/null)
          title=$(python -c "import json;print(' / '.join(s.get('title','?') for s in json.load(open('out/shorts/report.json'))['shorts'])[:90])")
          gh release create "short-${{ github.run_id }}" --prerelease --title "Short for review: $title" \
            --notes "Shorts from long video run ${{ inputs.long_run }}. Watch before uploading. Details: bench-results/shorts/${{ github.run_id }}/report.json" \
            $files

      - name: Save results to the bench-results branch
        if: always()
        timeout-minutes: 3
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin bench-results
          git worktree add results FETCH_HEAD
          git -C results checkout -B bench-results
          dest="results/shorts/${{ github.run_id }}"
          mkdir -p "$dest"
          cd out/shorts
          cp build.log report.json shorts_plan.json "../../$dest/" 2>/dev/null || true
          cp -r llm ffmpeg_logs "../../$dest/" 2>/dev/null || true
          cp music/music.licence.json "../../$dest/" 2>/dev/null || true
          for d in short*/; do
            [ -d "$d" ] || continue
            mkdir -p "../../$dest/$d"
            cp -r "$d"/raw "../../$dest/$d" 2>/dev/null || true
            cp "$d"/captions.ass "$d"/*_description.txt "../../$dest/$d" 2>/dev/null || true
            # small 360p preview to look at from a phone
            ffmpeg -nostdin -loglevel error -y -i "$d"/short*.mp4 -vf scale=360:640 -c:v libx264 -crf 30 -c:a aac -b:a 64k \
              "../../$dest/$d/preview_360p.mp4" < /dev/null || true
          done
          cd ../../results
          git add -A
          git commit -m "Shorts ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push origin bench-results && break
            git pull --rebase origin bench-results
            sleep 5
          done
