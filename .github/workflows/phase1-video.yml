name: Phase 1 video

# Topic in, upload-ready package out. Manual only: Actions -> Phase 1 video -> Run workflow.
# The owner reviews every video and uploads it by hand in YouTube Studio.
# Results (review sheet, script with sources, licences, contact sheet, 480p preview, logs)
# go to the bench-results branch under phase1/<run_id>/. The full video, subtitles and
# description are attached to the run as "phase1-package" for 7 days.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic or question"
        required: true
        default: "How does GPS know where you are?"
      scenes:
        description: "Keep only the first N scenes (small test). 0 = full video"
        default: "0"
      resume_from:
        description: "Optional: run id of an earlier run (bench-results/phase1/<id>) whose plan, sources and script to reuse. Saves free API quota"
        default: ""
      new_visual_plan:
        description: "With resume_from: make a new visual plan instead of reusing the old one"
        type: boolean
        default: false
      stop_after_script:
        description: "Own-voice video, step 1: stop after the checked script and give the recording script"
        type: boolean
        default: false
      owner_voice_folder:
        description: "Own-voice video, step 2: folder in the repo with the owner's recordings (voice/...). Use with resume_from = the step-1 run id"
        default: ""
      max_drawings:
        description: "AI ink drawings per video (about 80 s each; 0 = photos and cards only)"
        default: "24"

permissions:
  contents: write
  models: read    # GitHub Models: free backup AI for light jobs

concurrency:
  group: phase1-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # FFmpeg 8.1 stable static build, cached (see CLAUDE.md lesson 1: apt hung, master looped).
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1

      - name: Install FFmpeg 8.1 (stable)
        timeout-minutes: 5
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/bin/ffmpeg" -version | head -1

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Cache subtitle model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en

      - name: Cache drawing model
        if: inputs.max_drawings != '0'
        uses: actions/cache@v4
        with:
          path: ~/hf-draw
          key: draw-segmind-vega-hub-v1

      - name: Install Python packages
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Install drawing tools (CPU-only PyTorch)
        if: inputs.max_drawings != '0'
        timeout-minutes: 10
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-draw.txt

      - name: Download voice model (first run only)
        timeout-minutes: 5
        run: bash scripts/download_models.sh models

      - name: Reuse finished stages from an earlier run
        if: inputs.resume_from != ''
        timeout-minutes: 2
        env:
          RESUME: ${{ inputs.resume_from }}
          NEW_PLAN: ${{ inputs.new_visual_plan }}
        run: |
          [[ "$RESUME" =~ ^[0-9]+$ ]] || { echo "resume_from must be a run id (digits)"; exit 1; }
          mkdir -p out/run
          git fetch --depth 1 origin bench-results
          # Only stages that don't depend on files left on the old runner (photos are searched again).
          for f in plan.json sources.json script_draft.json script.json factcheck.json visual_plan.json; do
            git show "FETCH_HEAD:phase1/$RESUME/$f" > "out/run/$f" 2>/dev/null && echo "reused $f" || rm -f "out/run/$f"
          done
          if [ "$NEW_PLAN" = "true" ]; then rm -f out/run/visual_plan.json && echo "visual plan will be made again"; fi

      - name: Make the video
        timeout-minutes: 95
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOPIC: ${{ inputs.topic }}
          SCENES: ${{ inputs.scenes }}
          STOP: ${{ inputs.stop_after_script }}
          VOICE: ${{ inputs.owner_voice_folder }}
          DRAW: ${{ inputs.max_drawings }}
        run: |
          set -o pipefail
          mkdir -p out/run
          extra=()
          [[ "$DRAW" =~ ^[0-9]+$ ]] || { echo "max_drawings must be a number"; exit 1; }
          extra+=(--max-drawings "$DRAW")
          if [ "$STOP" = "true" ]; then extra+=(--stop-after-script); fi
          if [ -n "$VOICE" ]; then
            [[ "$VOICE" =~ ^voice/[A-Za-z0-9._/-]+$ && "$VOICE" != *..* ]] || { echo "owner_voice_folder must be a folder under voice/"; exit 1; }
            [ -d "$VOICE" ] || { echo "folder $VOICE not found in the repo"; exit 1; }
            extra+=(--owner-audio "$GITHUB_WORKSPACE/$VOICE")
          fi
          python phase1/make_video.py --topic "$TOPIC" --scenes "$SCENES" --models models --out out/run "${extra[@]}" 2>&1 | tee out/run/build.log

      # A plain video.mp4 to download (Chrome blocked the artifact zip as a "dangerous download")
      - name: Publish video as a GitHub Release (pre-release, private repo)
        if: success() && inputs.stop_after_script != true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(python -c "import json;print(json.load(open('out/run/report.json')).get('title','video')[:80])")
          verdict=$(python -c "import json;print(json.load(open('out/run/report.json')).get('gate',{}).get('verdict','?'))")
          # Rule R1 (owner, 28 Oct): only a video that passes every automatic check is ready for review.
          if [ "$verdict" = "FAIL" ]; then label="DRAFT - do not upload"; else label="Ready for your review"; fi
          gh release create "video-${{ github.run_id }}" --prerelease --title "$label: $title" \
            --notes "$label. Quality gate: $verdict (see the top of review.md, run ${{ github.run_id }}). Upload only after every check passes and you have watched it." \
            out/run/video.mp4 out/run/thumbnail.jpg out/run/subtitles.srt out/run/description.txt out/run/credits.txt out/run/review.md

      - name: Upload video package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-package
          path: |
            out/run/video.mp4
            out/run/thumbnail.jpg
            out/run/subtitles.srt
            out/run/description.txt
            out/run/review.md
            out/run/licences.json
            out/run/facts.csv
            out/run/credits.txt
            out/run/gate.json
            out/run/recording_script.md
            out/run/contact_sheet.jpg
          retention-days: 7

      - name: Save results to the bench-results branch
        if: always()
        timeout-minutes: 3
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin bench-results
          git worktree add results FETCH_HEAD
          git -C results checkout -B bench-results
          dest="results/phase1/${{ github.run_id }}"
          mkdir -p "$dest"
          cd out/run
          cp build.log report.json review.md description.txt licences.json facts.csv credits.txt gate.json recording_script.md voice_match.json drawing_log.json delivery.json keywords.json keywords.ass thumbnail.jpg thumbnail.json plan.json sources.json \
             script_draft.json script.json factcheck.json timing.json visual_plan.json visuals.json photo_log.json \
             subtitles.srt contact_sheet.jpg preview_480p.mp4 diagnostics.json "../../$dest/" 2>/dev/null || true
          cp -r llm "../../$dest/" 2>/dev/null || true
          cp music/music.licence.json "../../$dest/" 2>/dev/null || true
          mkdir -p "../../$dest/drawings" && cp drawings/result.json drawings/drawings.log drawings/jobs.json "../../$dest/drawings/" 2>/dev/null || true
          mkdir -p "../../$dest/ffmpeg_logs"
          # FFmpeg logs: the join/mux/preview steps, plus any segment log that mentions an error
          cp ffmpeg_logs/concat_*.log ffmpeg_logs/mux.log ffmpeg_logs/preview*.log "../../$dest/ffmpeg_logs/" 2>/dev/null || true
          grep -lis error ffmpeg_logs/*.log | xargs -r cp -t "../../$dest/ffmpeg_logs/" || true
          cd ../../results
          git add -A
          git commit -m "Phase 1 video ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push origin bench-results && break
            git pull --rebase origin bench-results
            sleep 5
          done
