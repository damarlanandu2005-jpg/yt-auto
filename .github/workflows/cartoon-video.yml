name: Stickman Short video (voice + pictures + captions)

# Owner decision 31 Oct 2026: the Short is the checked script + the FLUX scene pictures (cartoon-brain / cartoon-pictures), assembled on
# GitHub with plain code and FFmpeg (yt_auto/short_video.py): Kokoro voice, several slow zoom/pan shots per picture, one-word captions,
# whoosh and click sounds, -14 LUFS. No AI request and no key. Results: bench-results cartoon-video/<run_id>/ and a GitHub pre-release
# short-video-<run_id> with the plain mp4 ("Ready for your review" or "DRAFT - do not upload", rule R1).
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "checked script.json inside the bench-results branch"
        default: "cartoon-short/40903619735/meta/script.json"
      pictures_path:
        description: "folder with flux2dev_fp16_<scene id>.jpg inside the bench-results branch"
        default: "cartoon-pictures/titanic/pictures"
      sources_path:
        description: "optional sources.json inside the bench-results branch (for the description)"
        default: "cartoon-short/40903619735/meta/sources.json"
      pictures_ok:
        description: "did every picture pass the picture check (and your eyes)? false = DRAFT"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cartoon-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1
      - name: Install FFmpeg 8.1 (stable)
        timeout-minutes: 5
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8
      - name: Install Python packages
        timeout-minutes: 10
        run: pip install "kokoro-onnx==0.6.1" "soundfile>=0.12" "numpy>=1.26" "Pillow>=10" "matplotlib>=3.8"
      - name: Download voice model (first run only)
        timeout-minutes: 5
        run: bash scripts/download_models.sh models
      - name: Get the script and pictures
        timeout-minutes: 3
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          PICTURES_PATH: ${{ inputs.pictures_path }}
          SOURCES_PATH: ${{ inputs.sources_path }}
        run: |
          set -e
          git fetch --depth 1 origin bench-results
          git worktree add results FETCH_HEAD
          mkdir -p in/pics
          cp "results/$SCRIPT_PATH" in/script.json
          cp results/"$PICTURES_PATH"/*.jpg in/pics/
          [ -n "$SOURCES_PATH" ] && cp "results/$SOURCES_PATH" in/sources.json || true
          ls in/pics
      - name: Make the video
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p out
          python cartoon/make_video.py --script in/script.json --pictures in/pics --sources in/sources.json --out out/short | tee out/make.log
      - name: Publish
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          PICTURES_OK: ${{ inputs.pictures_ok }}
        run: |
          set -e
          rm -rf out/short/work
          ok=$(python3 -c "import json;r=json.load(open('out/short/report.json'));print('yes' if all(r['checks'].values()) else 'no')")
          if [ "$ok" = yes ] && [ "$PICTURES_OK" = true ]; then title="Ready for your review"; else title="DRAFT - do not upload"; fi
          echo "release title: $title"
          gh release create "short-video-${{ github.run_id }}" out/short/short.mp4 out/short/description.txt --prerelease \
            --title "$title (Short ${{ github.run_id }})" --notes "Voice, pictures and captions assembled by yt_auto/short_video.py. Report: bench-results cartoon-video/${{ github.run_id }}/report.json. Watch it fully before uploading."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results checkout -B bench-results
          dest="results/cartoon-video/${{ github.run_id }}"
          mkdir -p "$dest"
          cp out/short/report.json out/short/timings.json out/short/captions.ass out/short/description.txt out/make.log "$dest/"
          ffmpeg -loglevel error -y -i out/short/short.mp4 -vf "fps=1/4,scale=216:-1,tile=6x3" -frames:v 1 "$dest/contact.jpg" || true
          cd results && git add -A && git commit -m "Short video ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git push origin bench-results && break; git pull --rebase origin bench-results; sleep 5; done
