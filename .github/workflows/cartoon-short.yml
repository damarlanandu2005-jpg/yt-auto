name: Stickman Short (topic in, Short out)

# Manual for now (the daily topic finder comes next). Follows cartoon/TEMPLATE.md:
#   write   (our code): plan -> Wikipedia -> 110-140 word script -> fact-check -> scenes.js. Who writes (owner, 29 Oct:
#           Kaggle first, Gemini as the backup):
#             kaggle-start   packs our code and starts kaggle/short_kernel.py on a free Kaggle GPU (qwen3:32b writes,
#                            gpt-oss:20b fact-checks, models from the private dataset); nothing else runs now
#             kaggle-collect fetches Kaggle's result and goes on to render; if Kaggle failed or stopped early,
#                            Gemini finishes the missing stages (every stage is cached, so it resumes)
#             gemini         the old way: everything on GitHub with Gemini
#   render  (explainroo, no secrets): voice, layout check, stills, video
#   fix     (our code, Gemini key): an AI looks at the last frame of every scene (blind description + judge);
#           layout errors and picture problems go back to the scene writer once
#   render2 (explainroo, no secrets): only after a fix; review2 looks at its pictures again (for the label)
#   publish (no outside code): release "Ready for your review" only if every check passed, else
#           "DRAFT - do not upload" (rule R1); results to bench-results/cartoon-short/<run_id>/
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic or question with a strong, true feeling"
        required: true
        default: "What happens if you fall into the Mariana Trench?"
      writer:
        description: "kaggle-start (open models on Kaggle, then run again with kaggle-collect ~40 min later), kaggle-collect, or gemini"
        type: choice
        options: [kaggle-start, kaggle-collect, gemini]
        default: kaggle-start

permissions:
  contents: read

concurrency:
  group: cartoon-short
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.done.outputs.ready }}
      job_id: ${{ steps.kc.outputs.job_id }}
    env:
      WRITER: ${{ inputs.writer || 'gemini' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Kaggle login
        if: env.WRITER != 'gemini'
        timeout-minutes: 5
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: bash kaggle/login.sh

      - name: Start the writing on Kaggle
        if: env.WRITER == 'kaggle-start'
        timeout-minutes: 10
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -e
          mkdir -p bundle/cartoon bundle/kaggle k
          cp -r yt_auto bundle/ && cp kaggle/ollama_setup.py bundle/kaggle/
          cp cartoon/make_short.py cartoon/SCENE_API.md cartoon/example_scenes.js cartoon/TEMPLATE.md bundle/cartoon/
          mkdir -p bundle/cartoon/emoji && cp cartoon/emoji/NAMES.txt bundle/cartoon/emoji/   # names only; files are added at render
          find bundle -name __pycache__ -prune -exec rm -rf {} +
          tar czf bundle.tgz -C bundle .
          # the saved models (kaggle-test.yml action=save-models); `datasets status` answered 403 right after the
          # upload (run 40867955929), so attach it and push again without it only if Kaggle refuses
          SAVED=true python3 - <<'EOF'
          import base64, json, os
          b = base64.b64encode(open("bundle.tgz", "rb").read()).decode()
          head = (f"JOB_ID = {os.environ['GITHUB_RUN_ID']!r}\nTOPIC = {os.environ['TOPIC']!r}\n"
                  "WRITE_MODELS = ['qwen3:32b']\nCHECK_MODELS = ['gpt-oss:20b']\n" f"BUNDLE = {b!r}\n")
          open("k/run.py", "w").write(head + open("kaggle/short_kernel.py").read())
          user = os.environ["KAGGLE_USERNAME"]
          json.dump({"id": f"{user}/yt-auto-short", "title": "yt-auto short", "code_file": "run.py",
                     "language": "python", "kernel_type": "script", "is_private": "true", "enable_gpu": "true",
                     "enable_internet": "true", "machine_shape": "NvidiaTeslaT4",
                     "dataset_sources": [f"{user}/ollama-models"] if os.environ["SAVED"] == "true" else [],
                     "competition_sources": [], "kernel_sources": [], "model_sources": []},
                    open("k/kernel-metadata.json", "w"), indent=1)
          EOF
          if ! kaggle kernels push -p k | tee push.txt || grep -qiE 'error|not found|forbidden' push.txt; then
            echo "push with the saved-models dataset refused; pushing without it (the models are downloaded instead)"
            python3 -c "import json;p='k/kernel-metadata.json';m=json.load(open(p));m['dataset_sources']=[];json.dump(m,open(p,'w'),indent=1)"
            kaggle kernels push -p k
          fi
          echo "::notice::Started on Kaggle. Run this workflow again with writer = kaggle-collect in about 40 minutes."

      - name: Collect the writing from Kaggle
        id: kc
        if: env.WRITER == 'kaggle-collect'
        timeout-minutes: 10
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          k="$KAGGLE_USERNAME/yt-auto-short"
          st=$(kaggle kernels status "$k" 2>&1 || true); echo "$st"
          if echo "$st" | grep -qiE 'running|queued'; then
            echo "::notice::Kaggle is still working. Run kaggle-collect again in 10-20 minutes."
            echo "state=wait" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p kout kp
          kaggle kernels output "$k" -p kout > /dev/null || true
          kaggle kernels pull "$k" -p kp > /dev/null || true
          # the job (run id + topic) from the output, else from the pushed script itself
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import ast, json, pathlib
          p = pathlib.Path("kout/job.json")
          job = json.loads(p.read_text()) if p.exists() else {}
          if not job.get("topic"):
              for line in pathlib.Path("kp/run.py").read_text().splitlines()[:4]:
                  name, _, value = line.partition(" = ")
                  if name in ("JOB_ID", "TOPIC"):
                      job[name.lower() if name == "TOPIC" else "job_id"] = ast.literal_eval(value)
          print("job_id=" + str(job.get("job_id", "")))
          print("topic=" + " ".join(str(job.get("topic", "")).split())[:200])
          print("kaggle_complete=" + str(bool(job.get("complete"))).lower())
          EOF
          id=$(grep '^job_id=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          [ -n "$id" ] || { echo "no Kaggle job found"; exit 1; }
          if gh api "repos/${{ github.repository }}/contents/cartoon-short/kaggle-done/$id?ref=bench-results" > /dev/null 2>&1; then
            echo "::notice::Kaggle job $id was already turned into a Short."
            echo "state=done-already" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p out/short/kaggle
          [ -d kout/short ] && cp -r kout/short/. out/short/
          cp kout/job.json out/short/kaggle/ 2>/dev/null || true
          cp -r kout/logs out/short/kaggle/ 2>/dev/null || true
          cp kout/*.log out/short/kaggle/ 2>/dev/null || true
          echo "state=ok" >> "$GITHUB_OUTPUT"

      - name: Install Python packages
        if: env.WRITER == 'gemini' || steps.kc.outputs.state == 'ok'
        timeout-minutes: 10
        run: pip install -r requirements.txt && python cartoon/make_short.py --help > /dev/null
      - name: Write the Short (finishes with Gemini whatever Kaggle did not finish; cached stages are kept)
        id: write
        if: env.WRITER == 'gemini' || steps.kc.outputs.state == 'ok'
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOPIC: ${{ steps.kc.outputs.topic || inputs.topic }}
        run: |
          set -o pipefail
          mkdir -p out/short
          python cartoon/make_short.py write --topic "$TOPIC" --out out/short 2>&1 | tee out/short/write.log
      - name: Ready for the render?
        id: done
        if: always()
        run: echo "ready=${{ steps.write.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.write.outcome != 'skipped'
        with:
          name: short-written
          path: out/short
          retention-days: 7

  render:
    needs: write
    if: needs.write.outputs.ready == 'true'
    uses: ./.github/workflows/cartoon-render.yml
    with:
      project_artifact: short-written
      out_artifact: short-render1

  fix:
    needs: render
    if: needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      fixed: ${{ steps.fix.outputs.fixed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: short-written
          path: out/short
      - uses: actions/download-artifact@v4
        with:
          name: short-render1
          path: out/render1
      - name: Review the pictures; repair scenes.js from layout errors and picture problems
        id: fix
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python cartoon/make_short.py fix --out out/short --log out/render1/log.txt --stills out/render1/render/stills 2>&1 | tee out/short/fix.log
          [ -f out/short/fixed ] && echo "fixed=true" >> "$GITHUB_OUTPUT" || echo "fixed=false" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: short-fixed
          path: out/short
          retention-days: 7

  render2:
    needs: fix
    if: needs.fix.outputs.fixed == 'true'
    uses: ./.github/workflows/cartoon-render.yml
    with:
      project_artifact: short-fixed
      out_artifact: short-render2

  review2:
    needs: [fix, render2]
    if: needs.render2.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: short-fixed
          path: out/short
      - uses: actions/download-artifact@v4
        with:
          name: short-render2
          path: out/render2
      - name: Review the pictures of the fixed render
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python cartoon/make_short.py review --out out/short --stills out/render2/render/stills --name picture_review2 2>&1 | tee out/short/review2.log
      - uses: actions/upload-artifact@v4
        with:
          name: short-review2
          path: out/short/meta
          retention-days: 7

  publish:
    needs: [write, render, fix, render2, review2]
    if: always() && needs.write.result == 'success' && needs.write.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Pick the final version and decide the label (rule R1)
        id: pick
        env:
          RENDER1_ERRORS: ${{ needs.render.outputs.errors }}
          RENDER2_RESULT: ${{ needs.render2.result }}
          RENDER2_ERRORS: ${{ needs.render2.outputs.errors }}
        run: |
          meta=art/short-written; [ -d art/short-fixed ] && meta=art/short-fixed
          final=art/short-render1; errors="$RENDER1_ERRORS"; review="$meta/meta/picture_review1.json"
          if [ "$RENDER2_RESULT" = "success" ] && [ -d art/short-render2 ]; then
            final=art/short-render2; errors="$RENDER2_ERRORS"; review=art/short-review2/picture_review2.json
          fi
          echo "final=$final" >> "$GITHUB_OUTPUT"; echo "meta=$meta" >> "$GITHUB_OUTPUT"
          python3 - "$meta/meta/report.json" "${errors:-1}" "$final" "$review" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, sys
          r = json.load(open(sys.argv[1]))
          errors = int(sys.argv[2] or 1)
          has_video = os.path.exists(os.path.join(sys.argv[3], "render", "video.mp4"))
          problems = list(r.get("story_problems", [])) + list(r.get("scene_problems", []))
          if errors: problems.append(f"{errors} layout error(s) in explainroo's check")
          if not has_video: problems.append("no video was rendered")
          try:
              rev = json.load(open(sys.argv[4]))
              bad = [f"{k}: {'; '.join(v)}" for k, v in rev.get("problems", {}).items() if v]
              if rev.get("error"): problems.append("pictures not reviewed: " + rev["error"][:120])
              problems += [f"picture {b}"[:200] for b in bad]
          except OSError:
              problems.append("pictures not reviewed")
          label = "Ready for your review" if not problems else "DRAFT - do not upload"
          print("label=" + label)
          print("problems=" + " | ".join(problems)[:900].replace("\n", " "))
          EOF
      - name: Publish as a pre-release
        if: hashFiles(format('{0}/render/video.mp4', steps.pick.outputs.final)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.pick.outputs.label }}
          PROBLEMS: ${{ steps.pick.outputs.problems }}
          FINAL: ${{ steps.pick.outputs.final }}
          META: ${{ steps.pick.outputs.meta }}
        run: |
          title=$(python3 -c "import json;print(json.load(open('$META/meta/plan.json'))['title'][:80])")
          by=$(python3 -c "import json;print(', '.join(json.load(open('$META/meta/report.json')).get('models_used', [])) or 'cached')")
          notes="$LABEL. ${PROBLEMS:-Every automatic check passed.} Watch it fully before uploading. Description: description.txt. Written by: $by."
          cp "$META/description.txt" description.txt
          gh release create "short-${{ github.run_id }}" --prerelease --title "$LABEL: $title" --notes "$notes" \
            "$FINAL/render/video.mp4" "$FINAL/render/video.cover.jpg" description.txt
      - name: Save results to the bench-results branch
        if: always()
        timeout-minutes: 3
        env:
          FINAL: ${{ steps.pick.outputs.final }}
          META: ${{ steps.pick.outputs.meta }}
          JOB_ID: ${{ needs.write.outputs.job_id }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin bench-results
          git worktree add results FETCH_HEAD
          git -C results checkout -B bench-results
          dest="results/cartoon-short/${{ github.run_id }}"
          mkdir -p "$dest"
          cp -r "$META/meta" "$META/project" "$dest/" 2>/dev/null || true
          cp "$META"/*.log "$META/description.txt" "$dest/" 2>/dev/null || true
          cp -r "$META/kaggle" "$dest/" 2>/dev/null || true
          if [ -n "$JOB_ID" ]; then  # this Kaggle job is used up: a later kaggle-collect must not make it again
            mkdir -p results/cartoon-short/kaggle-done && echo "${{ github.run_id }}" > "results/cartoon-short/kaggle-done/$JOB_ID"
          fi
          cp art/short-review2/picture_review2.json "$dest/meta/" 2>/dev/null || true
          for r in art/short-render1 art/short-render2; do
            [ -d "$r" ] || continue
            n=$(basename "$r"); mkdir -p "$dest/$n"
            cp "$r/log.txt" "$dest/$n/" 2>/dev/null || true
            cp "$r/render/sheet.jpg" "$r/render/video.cover.jpg" "$dest/$n/" 2>/dev/null || true
            cp -r "$r/render/stills" "$dest/$n/" 2>/dev/null || true
          done
          cd results
          git add -A
          git commit -m "Stickman Short ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do
            git push origin bench-results && break
            git pull --rebase origin bench-results
            sleep 5
          done
