name: AI models check

# Checks the light AI models (Gemma 4, Flash-Lite, GitHub Models): JSON answers, pictures in order,
# and their limits. About 2 requests per model. Results: bench-results/phase5/models-check/<run_id>/.
on:
  workflow_dispatch:
    inputs:
      github_only:
        description: "Only probe GitHub Models at network level (no Gemini requests)"
        type: boolean
        default: false
      cloudflare_only:
        description: "Only the tiny Cloudflare probes (phase5/check_cloudflare.py, a few neurons)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow
        timeout-minutes: 3
        run: pip install Pillow
      - name: Probe GitHub Models (network level)
        timeout-minutes: 3
        env:
          TOK: ${{ github.token }}
        run: |
          mkdir -p out/check
          { getent hosts models.github.ai; env | grep -i _proxy | sed 's/=.*/=(set)/';
            for u in https://models.github.ai/catalog/models https://models.inference.ai.azure.com/models; do
              echo "== $u"; curl -sS -m 30 -o /tmp/body -D - -H "Authorization: Bearer $TOK" \
                -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$u" -w '\nremote_ip=%{remote_ip} code=%{http_code}\n' || true
              head -c 400 /tmp/body; echo; done; } 2>&1 | grep -iv authorization | tee out/check/github_probe.txt
      - name: Probe Cloudflare (tiny requests, exact replies)
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mkdir -p out/check && python phase5/check_cloudflare.py out/check 2>&1 | tee out/check/cloudflare.log
      - name: Check models
        if: ${{ !inputs.github_only && !inputs.cloudflare_only }}
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          mkdir -p out/check
          python phase5/check_models.py out/check 2>&1 | tee out/check/build.log
      - name: Save to bench-results
        if: always()
        timeout-minutes: 3
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin bench-results
          git worktree add results FETCH_HEAD
          git -C results checkout -B bench-results
          dest="results/phase5/models-check/${{ github.run_id }}"
          mkdir -p "$dest" && cp -r out/check/. "$dest/"
          cd results && git add -A && git commit -m "AI models check ${{ github.run_id }}"
          for i in 1 2 3 4 5; do git push origin bench-results && break; git pull --rebase origin bench-results; sleep 5; done
