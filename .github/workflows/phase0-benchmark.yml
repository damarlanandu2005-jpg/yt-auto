name: Phase 0 benchmark

# Builds one complete ~6-minute video three times in a row and records timings.
# Runs when pipeline code changes on main, or by hand (Actions tab -> Run workflow).
# Phase 0 has passed (3/3 on 27 Oct 2026), so it now runs only when started by hand:
# Actions tab -> Phase 0 benchmark -> Run workflow (choose how many runs).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many runs in a row"
        default: "1"
        type: choice
        options: ["1", "3"]

permissions:
  contents: write

concurrency:
  group: phase0-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1        # one after another, as the blueprint asks
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.runs == '3' && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # FFmpeg 8.1 stable release (static build, cached).
      # Not apt: Ubuntu's apt-get hung twice (12+ and 8+ minutes) on GitHub runners.
      # Not "master": the daily development build looped forever while decoding on AMD runners.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1

      - name: Install FFmpeg 8.1 (stable)
        timeout-minutes: 5
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/bin/ffmpeg" -version | head -1

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Cache subtitle model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en

      - name: Install Python packages
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Download voice model (first run only)
        run: bash scripts/download_models.sh models

      - name: Build the video
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p out/run
          python phase0/run_benchmark.py --models models --out out/run 2>&1 | tee out/run/build.log

      - name: Upload full video (run 1 only)
        if: matrix.run == 1 && success()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-video
          path: |
            out/run/video.mp4
            out/run/subtitles.srt
          retention-days: 7

      - name: Save results to the bench-results branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin bench-results 2>/dev/null; then
            git worktree add results FETCH_HEAD
            git -C results checkout -B bench-results
          else
            git worktree add --orphan -b bench-results results
          fi
          dest="results/${{ github.run_id }}/run${{ matrix.run }}"
          mkdir -p "$dest"
          cp out/run/benchmark.json "$dest/" 2>/dev/null || echo "no benchmark.json (build failed)"
          cp out/run/build.log "$dest/" 2>/dev/null || true
          cp out/run/diagnostics.json "$dest/" 2>/dev/null || true
          mkdir -p "$dest/ffmpeg_logs"
          cp out/run/ffmpeg_logs/preview*.log out/run/ffmpeg_logs/mux.log out/run/ffmpeg_logs/concat_*.log "$dest/ffmpeg_logs/" 2>/dev/null || true
          lscpu > "$dest/lscpu.txt" 2>/dev/null || true
          if [ "${{ matrix.run }}" = "1" ]; then
            cp out/run/preview_480p.mp4 out/run/subtitles.srt "$dest/" || true
            mkdir -p "$dest/frames" && cp out/run/frames/*_00.png "$dest/frames/" || true
          fi
          cd results
          git add -A
          git commit -m "Phase 0 benchmark ${{ github.run_id }} run ${{ matrix.run }}"
          for i in 1 2 3 4 5; do
            git push origin bench-results && break
            git pull --rebase origin bench-results
            sleep 5
          done
